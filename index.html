<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Finance · Tarjetas</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%232a78d6'/><text x='16' y='23' font-family='Segoe UI,sans-serif' font-size='19' fill='white' text-anchor='middle'>F</text></svg>">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Login -->
  <section id="login-view" class="login" hidden>
    <form id="login-form" class="login-card" autocomplete="on">
      <div class="brand"><span class="monogram">F</span><div><strong>FINANCE</strong><span class="sub">Control de tarjetas</span></div></div>
      <div>
        <div class="eyebrow">Acceso</div>
        <h2 style="margin-top:6px">Inicia sesión</h2>
      </div>
      <label id="api-field" hidden>URL del servidor (Apps Script)
        <input name="api" type="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" spellcheck="false">
        <span class="muted">Se guarda solo en este navegador.</span></label>
      <label>Usuario <input name="usuario" autocomplete="username" required></label>
      <label>Contraseña <input name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn primary" type="submit">Entrar</button>
      <p id="login-error" class="error" role="alert"></p>
      <button type="button" class="btn small ghost" id="api-change" hidden>Cambiar servidor</button>
    </form>
  </section>

  <!-- App -->
  <div id="app-view" hidden>
    <div class="app">
      <header class="topbar">
        <div class="brand"><span class="monogram">F</span><div><strong>FINANCE</strong><span class="sub">Control de tarjetas</span></div></div>
        <div class="filters">
          <label>Periodo <select id="f-periodo"></select></label>
          <label>Tarjeta <select id="f-tarjeta"></select></label>
        </div>
        <div class="top-meta">
          <span class="user-chip"><span class="avatar" id="user-avatar"></span><span id="user-name"></span></span>
          <button class="btn small" id="btn-export">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
            Excel</button>
          <button class="btn small ghost" id="btn-logout">Salir</button>
        </div>
      </header>
      <div class="layout">
        <aside class="sidebar">
          <div class="sidebar-head">
            <div class="label-caps">Secciones</div>
            <button type="button" class="collapse-btn" id="btn-collapse" aria-controls="tabs" aria-expanded="true" title="Contraer menú">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/><path d="m15 10-2 2 2 2"/></svg>
            </button>
          </div>
          <nav class="nav" id="tabs" aria-label="Secciones"></nav>
          <div class="sidebar-foot" id="sidebar-foot"></div>
        </aside>
        <main id="main"></main>
      </div>
    </div>
  </div>

  <dialog id="modal"><div id="modal-body"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="loading" hidden><div class="spinner"></div></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/config.local.js" onerror="this.remove()"></script>
  <script src="js/mock.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
